<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Gestión de carritos{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; color: #172033; }
        .topbar { background: #172033; }
        .brand-mark { color: #63e6be; }
        .card { border: 0; border-radius: 1rem; }
        .metric { min-height: 132px; }
        .section-title { letter-spacing: -.02em; }
        .status { font-size: .75rem; }
    </style>
</head>
<body>
<nav class="navbar navbar-dark topbar shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'router_por_rol' %}"><span class="brand-mark">●</span> Parque NFC</a>
        <div class="d-flex align-items-center gap-3">
            <span class="text-white-50 small">{{ request.user.username }}</span>
            <a href="{% url 'logout' %}" class="btn btn-outline-light btn-sm">Cerrar sesión</a>
        </div>
    </div>
</nav>
<main class="container py-4">
    {% block content %}{% endblock %}
</main>
</body>
</html>
