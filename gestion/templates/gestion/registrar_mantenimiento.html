<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Mantenimiento</title>
    <!-- Importamos Bootstrap 5 para un diseño moderno -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0 rounded-4 p-4">
                    <h2 class="text-center text-primary mb-4">🛠️ Mantenimiento Técnico</h2>
                    {% if vehiculo %}
                        <div class="alert alert-info text-center fw-bold">Vehículo: {{ vehiculo.nombre }}</div>
                    {% endif %}
                    <form method="POST">
                        {% csrf_token %}
                        <!-- Esto convierte los campos de Django en estilos modernos de Bootstrap -->
                        {% for field in form %}
                            <div class="mb-3">
                                <label class="form-label fw-bold">{{ field.label }}</label>
                                {{ field }}
                                {% if field.help_text %}
                                    <div class="form-text">{{ field.help_text }}</div>
                                {% endif %}
                            </div>
                        {% endfor %}
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold rounded-3">Guardar Registro</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
